<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vue.js Test</title>

</head>

<body>
  <div id="app">
    <p>
      <input type="text" v-model:value="km">km
    </p>
    <p>
      <input type="text" v-model:value="m">m
    </p>
    <p>
      <input type="text" v-model:value="mm">mm
    </p>

  </div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <script>

    const { createApp } = Vue;

    const app = createApp({
      data() {
        return {
          km: 0,
          m: 0,
          mm: 0
        }
      },
      watch: {
        km(value) {
          this.km = value
          this.m = value * 1000
          this.mm = value * 1000000
        },
        m(value) {
          this.km = value / 1000
          this.m = value
          this.mm = value * 1000
        },
        mm(value) {
          this.km = value / 1000000
          this.m = value / 1000
          this.mm = value
        }

      }
    }).mount('#app')
  </script>

</body>

</html>
